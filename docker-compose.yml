services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingredient_lens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL, which points at `localhost` for host-side
      # tooling (local `alembic`/`pytest` runs against the port-mapped 5432).
      # Inside the compose network, Postgres is reachable at the `db` service name.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ingredient_lens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
